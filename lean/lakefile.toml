name = "pcrevera"
version = "0.0.0"
defaultTargets = ["Pcrevera"]

# No dependencies on purpose. Batteries joins at M6, when layers S and R start
# and the proofs actually need it; mathlib stays out so CI stays fast.

[[lean_lib]]
name = "Pcrevera"

[[require]]
name = "batteries"
scope = "leanprover-community"
version = "git#v4.32.2"

[[lean_exe]]
name = "corpuscheck"
root = "CorpusCheck"
