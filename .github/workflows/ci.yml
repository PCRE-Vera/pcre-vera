name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python and the pcre2 oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # The build directory is named after a digest of the pin, the shim source
      # and the recipe, so the same key can never hand back a build of anything
      # else.
      - name: Cache the pinned pcre2 build
        uses: actions/cache@v6
        with:
          path: tmp/oracle
          key: oracle-${{ runner.os }}-${{ hashFiles('oracle/pcre2-pin.toml', 'oracle/pcre2shim/shim.c', 'src/pcrevera/oracle/build.py') }}

      - run: uv sync --frozen

      - name: Check the oracle against the pin
        run: uv run python -m pcrevera.oracle verify

      # The generated Go and JavaScript are committed, so this is what keeps
      # them honest: a file that is not what today's generator produces fails
      # here rather than drifting quietly.
      - name: Check the committed generated files
        run: uv run python -m pcrevera.backends verify

      - run: uv run pytest

  lean:
    name: Lean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"

  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gen/go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: go vet ./...
      - run: go test ./...

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gen/js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gen/js/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node --test
